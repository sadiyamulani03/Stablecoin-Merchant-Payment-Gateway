services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stablecoin_gateway}
      MYSQL_USER: ${MYSQL_USER:-gateway}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gatewaypassword}
    volumes: ["mysql_data:/var/lib/mysql"]
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    ports: ["4000:4000"]
    depends_on: [mysql]
volumes:
  mysql_data:
